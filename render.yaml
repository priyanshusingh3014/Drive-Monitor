databases:
  - name: system-monitor-db
    plan: free
    databaseName: system_monitor
    user: system_monitor

services:
  - type: web
    name: system-monitor-dashboard
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker"
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: system-monitor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_API_TOKEN
        generateValue: true
      - key: AGENT_MAX_FILE_CONTENT_BYTES
        value: 5242880
      - key: WEB_CONCURRENCY
        value: 4
